name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pytest -q tests
      - run: python -m ruff check telegram_chat_bot.py tests
      - run: python -m py_compile telegram-chat-bot.py
